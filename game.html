<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RPG Fantasy - Monde Autonome</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;700&display=swap"
    rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/game.css">
</head>

<body>
  <div id="game-app">
    <!-- Setup Screen -->
    <div id="setup-screen" class="active">
      <div class="setup-card glass-panel fade-in">
        <h2>Création d'Avatar</h2>
        <p class="subtitle">Entrez dans le monde autonome</p>

        <form id="setup-form">
          <div class="form-group">
            <label for="npc-name">Nom du Personnage</label>
            <input type="text" id="npc-name" required placeholder="ex. Sire Galahad">
          </div>

          <div class="form-group">
            <label for="npc-personality">Personnalité & Histoire</label>
            <textarea id="npc-personality" required rows="4"
              placeholder="Décrivez qui vous êtes, votre manière de parler et vos objectifs..."></textarea>
          </div>

          <div class="form-group">
            <label for="npc-mood">Humeur Initiale</label>
            <select id="npc-mood">
              <option value="calme">Calme</option>
              <option value="joyeux">Joyeux</option>
              <option value="triste">Triste</option>
              <option value="en colère">En colère</option>
              <option value="excité">Excité</option>
              <option value="anxieux">Anxieux</option>
              <option value="confiant">Confiant</option>
              <option value="effrayé">Effrayé</option>
              <option value="curieux">Curieux</option>
              <option value="méfiant">Méfiant</option>
              <option value="déterminé">Déterminé</option>
              <option value="neutre">Neutre</option>
              <option value="surpris">Surpris</option>
              <option value="fatigué">Fatigué</option>
            </select>
          </div>

          <button type="submit" id="start-btn" class="btn-primary">Entrer dans le Monde</button>
        </form>
      </div>
    </div>

    <!-- Loading Screen -->
    <div id="game-loading" class="hidden">
      <div class="loading-content glass-panel">
        <h1>Initialisation du Monde</h1>
        <div class="loader-bar">
          <progress id="game-progress" value="0" max="100"></progress>
        </div>
        <p id="game-status">Chargement des ressources...</p>
      </div>
    </div>

    <!-- Game Canvas Container -->
    <div id="game-container" class="hidden">
      <canvas id="game-canvas"></canvas>

      <!-- UI Overlay -->
      <div id="game-ui">
        <div class="ui-panel top-panel glass-panel">
          <div class="header-info">
            <h2>RPG Fantasy</h2>
            <span class="status-badge">En ligne</span>
          </div>
          <div class="controls">
            <button id="edit-character-btn" class="btn-secondary">Modifier Personnage</button>
            <button id="pause-btn" class="btn-secondary">Pause</button>
            <button id="reset-btn" class="btn-secondary">Réinitialiser</button>
            <a href="index.html" class="btn-secondary chat-link">Mode Chat</a>
          </div>
        </div>

        <div class="ui-panel event-log glass-panel">
          <h3>Événements du Monde</h3>
          <div id="event-log-content"></div>
        </div>

        <!-- NEW: Streaming UI Container -->
        <div id="streaming-ui-container" class="glass-panel hidden">
          <div class="stream-header">
            <span id="streaming-source">Personnage</span>
            <span class="typing-indicator">Réflexion...</span>
          </div>
          <div id="streaming-content" class="stream-text">
            <!-- Stream text will appear here -->
          </div>
        </div>
      </div>

      <!-- Character Edit Modal -->
      <div id="edit-character-modal" class="hidden">
        <div class="edit-modal-overlay"></div>
        <div class="edit-modal-content glass-panel fade-in">
          <h2>Modifier Votre Personnage</h2>
          <p class="subtitle">Les changements s'appliquent immédiatement</p>

          <form id="edit-character-form">
            <div class="form-group">
              <label for="edit-name">Nom du Personnage</label>
              <input type="text" id="edit-name" required placeholder="ex. Sire Galahad">
            </div>

            <div class="form-group">
              <label for="edit-personality">Personnalité & Histoire</label>
              <textarea id="edit-personality" required rows="4"
                placeholder="Décrivez qui vous êtes, votre manière de parler et vos objectifs..."></textarea>
            </div>

            <div class="form-group">
              <label for="edit-mood">Humeur</label>
              <select id="edit-mood">
                <option value="calme">Calme</option>
                <option value="joyeux">Joyeux</option>
                <option value="triste">Triste</option>
                <option value="en colère">En colère</option>
                <option value="excité">Excité</option>
                <option value="anxieux">Anxieux</option>
                <option value="confiant">Confiant</option>
                <option value="effrayé">Effrayé</option>
                <option value="curieux">Curieux</option>
                <option value="méfiant">Méfiant</option>
                <option value="déterminé">Déterminé</option>
                <option value="neutre">Neutre</option>
                <option value="surpris">Surpris</option>
                <option value="fatigué">Fatigué</option>
              </select>
            </div>

            <div class="button-group">
              <button type="submit" class="btn-primary">Enregistrer</button>
              <button type="button" id="cancel-edit-btn" class="btn-secondary">Annuler</button>
            </div>
          </form>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="js/game.js"></script>
</body>

</html>
