<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fantasy RPG - Autonomous World</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;700&display=swap"
    rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/game.css">
</head>

<body>
  <div id="game-app">
    <!-- Setup Screen -->
    <div id="setup-screen" class="active">
      <div class="setup-card glass-panel fade-in">
        <h2>Avatar Setup</h2>
        <p class="subtitle">Enter the autonomous realm</p>

        <form id="setup-form">
          <div class="form-group">
            <label for="npc-name">Character Name</label>
            <input type="text" id="npc-name" required placeholder="e.g. Sir Galahad">
          </div>

          <div class="form-group">
            <label for="npc-personality">Personality & Backstory</label>
            <textarea id="npc-personality" required rows="4"
              placeholder="Describe who you are, your manner of speaking, and your goals..."></textarea>
          </div>

          <div class="form-group">
            <label for="npc-mood">Initial Mood</label>
            <select id="npc-mood">
              <option value="calm">Calm</option>
              <option value="joyeux">Joyful</option>
              <option value="curieux">Curious</option>
              <option value="méfiant">Suspicious</option>
              <option value="déterminé">Determined</option>
            </select>
          </div>

          <button type="submit" id="start-btn" class="btn-primary">Enter World</button>
        </form>
      </div>
    </div>

    <!-- Loading Screen -->
    <div id="game-loading" class="hidden">
      <div class="loading-content glass-panel">
        <h1>Initializing World</h1>
        <div class="loader-bar">
          <progress id="game-progress" value="0" max="100"></progress>
        </div>
        <p id="game-status">Loading assets...</p>
      </div>
    </div>

    <!-- Game Canvas Container -->
    <div id="game-container" class="hidden">
      <canvas id="game-canvas" width="800" height="600"></canvas>

      <!-- UI Overlay -->
      <div id="game-ui">
        <div class="ui-panel top-panel glass-panel">
          <div class="header-info">
            <h2>Fantasy RPG</h2>
            <span class="status-badge">Live</span>
          </div>
          <div class="controls">
            <button id="pause-btn" class="btn-secondary">Pause</button>
            <button id="reset-btn" class="btn-secondary">Reset</button>
            <a href="index.html" class="btn-secondary chat-link">Chat Mode</a>
          </div>
        </div>

        <div class="ui-panel event-log glass-panel">
          <h3>World Events</h3>
          <div id="event-log-content"></div>
        </div>

        <!-- NEW: Streaming UI Container -->
        <div id="streaming-ui-container" class="glass-panel hidden">
          <div class="stream-header">
            <span id="streaming-source">NPC Name</span>
            <span class="typing-indicator">Thinking...</span>
          </div>
          <div id="streaming-content" class="stream-text">
            <!-- Stream text will appear here -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="js/game.js"></script>
</body>

</html>
