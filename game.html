<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fantasy RPG - AI Watch Mode</title>
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/game.css">
</head>
<body>
  <div id="game-app">
     <!-- Setup Screen -->
     <div id="setup-screen" style="display: none; position: fixed; inset: 0; background: #2C3E50; z-index: 100; align-items: center; justify-content: center; flex-direction: column; color: white;">
        <div style="background: #34495E; padding: 2rem; border-radius: 12px; width: 400px; box-shadow: 0 4px 6px rgba(0,0,0,0.3);">
            <h2 style="margin-bottom: 20px; text-align: center;">Configuration de votre Avatar</h2>
            <form id="setup-form" style="display: flex; flex-direction: column; gap: 15px;">
                <div>
                    <label for="npc-name" style="display: block; margin-bottom: 5px;">Nom du Personnage</label>
                    <input type="text" id="npc-name" required style="width: 100%; padding: 8px; border-radius: 4px; border: none;" placeholder="ex: Sir Galahad">
                </div>
                
                <div>
                    <label for="npc-personality" style="display: block; margin-bottom: 5px;">Personnalité & Trait</label>
                    <textarea id="npc-personality" required rows="4" style="width: 100%; padding: 8px; border-radius: 4px; border: none;" placeholder="Décrivez qui vous êtes, comment vous parlez..."></textarea>
                </div>

                <div>
                    <label for="npc-mood" style="display: block; margin-bottom: 5px;">Humeur Initiale</label>
                    <select id="npc-mood" style="width: 100%; padding: 8px; border-radius: 4px; border: none;">
                        <option value="calm">Calme</option>
                        <option value="joyeux">Joyeux</option>
                        <option value="curieux">Curieux</option>
                        <option value="méfiant">Méfiant</option>
                        <option value="déterminé">Déterminé</option>
                    </select>
                </div>

                <button type="submit" id="start-btn" style="background: #27AE60; color: white; border: none; padding: 12px; border-radius: 6px; cursor: pointer; font-weight: bold; margin-top: 10px;">Rejoindre le monde</button>
            </form>
        </div>
    </div>

    <!-- Loading Screen -->
    <div id="game-loading">
      <h1>Loading Fantasy RPG World...</h1>
      <progress id="game-progress" value="0" max="100"></progress>
      <p id="game-status">Initializing...</p>
    </div>

    <!-- Game Canvas Container -->
    <div id="game-container" class="hidden">
      <canvas id="game-canvas" width="800" height="600"></canvas>

      <!-- UI Overlay -->
      <div id="game-ui">
        <div class="ui-panel top-panel">
          <h2>Fantasy RPG - Watch Mode</h2>
          <div class="controls">
            <button id="pause-btn">Pause</button>
            <button id="reset-btn">Reset</button>
            <a href="index.html" class="chat-link">Chat Mode</a>
          </div>
        </div>

        <div class="ui-panel event-log">
          <h3>Event Log</h3>
          <div id="event-log-content"></div>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="js/game.js"></script>
</body>
</html>
