<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ministral Chat - Text Mode</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #f5f5f5;
      color: #1e1e1e;
      overflow: hidden;
    }

    #app {
      width: 100vw;
      height: 100vh;
      display: flex;
    }

    /* Loading Screen */
    #loading {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 30px;
      background: linear-gradient(135deg, #f5f5f5 0%, #efefef 100%);
    }

    #loading h1 {
      font-size: 28px;
      font-weight: 600;
      color: #ff8205;
    }

    #loading progress {
      width: 300px;
      height: 8px;
      border: none;
      border-radius: 4px;
      background: #e0e0e0;
      appearance: none;
      -webkit-appearance: none;
    }

    #loading progress::-webkit-progress-bar {
      background: #e0e0e0;
      border-radius: 4px;
    }

    #loading progress::-webkit-progress-value {
      background: #ff8205;
      border-radius: 4px;
      transition: width 0.3s;
    }

    #loading progress::-moz-progress-bar {
      background: #ff8205;
      border-radius: 4px;
      transition: width 0.3s;
    }

    #status {
      font-size: 14px;
      color: #666;
    }

    /* Chat Interface */
    #chat {
      width: 100%;
      height: 100%;
      display: none;
      flex-direction: column;
      background: white;
    }

    #chat.active {
      display: flex;
    }

    /* Header */
    .chat-header {
      padding: 20px;
      background: white;
      border-bottom: 1px solid #e0e0e0;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .chat-header h1 {
      font-size: 20px;
      color: #1e1e1e;
      font-weight: 600;
    }

    .chat-header-stats {
      font-size: 12px;
      color: #999;
    }

    /* Messages Container */
    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    #messages::-webkit-scrollbar {
      width: 8px;
    }

    #messages::-webkit-scrollbar-track {
      background: #f5f5f5;
    }

    #messages::-webkit-scrollbar-thumb {
      background: #ccc;
      border-radius: 4px;
    }

    #messages::-webkit-scrollbar-thumb:hover {
      background: #999;
    }

    .message {
      display: flex;
      gap: 8px;
      animation: slideIn 0.3s ease-out;
    }

    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .message.user {
      justify-content: flex-end;
    }

    .message.assistant {
      justify-content: flex-start;
    }

    .message-content {
      max-width: 70%;
      padding: 12px 16px;
      border-radius: 12px;
      word-wrap: break-word;
      line-height: 1.4;
      font-size: 14px;
    }

    .message.user .message-content {
      background: #007AFF;
      color: white;
      border-bottom-right-radius: 4px;
    }

    .message.assistant .message-content {
      background: #f0f0f0;
      color: #1e1e1e;
      border-bottom-left-radius: 4px;
    }

    .message.assistant .message-content.streaming::after {
      content: '▊';
      animation: blink 1s infinite;
      margin-left: 4px;
    }

    @keyframes blink {
      0%, 49% {
        opacity: 1;
      }
      50%, 100% {
        opacity: 0;
      }
    }

    /* Empty State */
    #messages.empty::before {
      content: 'Commencez une conversation...';
      margin: auto;
      color: #999;
      font-size: 16px;
    }

    /* Input Area */
    #input-area {
      border-top: 1px solid #e0e0e0;
      padding: 16px 20px;
      background: white;
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    .input-wrapper {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    #user-input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #e0e0e0;
      border-radius: 20px;
      font-family: inherit;
      font-size: 14px;
      resize: none;
      max-height: 100px;
      outline: none;
      transition: border-color 0.2s;
    }

    #user-input:focus {
      border-color: #ff8205;
    }

    #user-input:disabled {
      background: #f5f5f5;
      color: #999;
      cursor: not-allowed;
    }

    .button-group {
      display: flex;
      gap: 8px;
    }

    button {
      padding: 10px 20px;
      border: none;
      border-radius: 20px;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
    }

    #send-btn {
      background: #ff8205;
      color: white;
      min-width: 80px;
    }

    #send-btn:hover:not(:disabled) {
      background: #fa500f;
      transform: scale(1.05);
    }

    #send-btn:disabled {
      background: #ccc;
      cursor: not-allowed;
    }

    #clear-btn {
      background: #f0f0f0;
      color: #1e1e1e;
      min-width: 80px;
    }

    #clear-btn:hover:not(:disabled) {
      background: #e0e0e0;
    }

    #clear-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    /* Stats */
    .stats-info {
      font-size: 12px;
      color: #999;
      padding: 8px 16px 0;
      text-align: right;
    }

    /* Error State */
    .error-message {
      background: #ffebee;
      color: #c62828;
      padding: 12px 16px;
      border-radius: 8px;
      margin: 10px;
      font-size: 14px;
    }

    /* Responsive */
    @media (max-width: 600px) {
      .message-content {
        max-width: 85%;
      }

      #messages {
        padding: 12px;
      }

      #input-area {
        padding: 12px 16px;
      }

      button {
        padding: 8px 16px;
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- Loading Screen -->
    <div id="loading">
      <h1>Chargement du modèle Ministral-3B...</h1>
      <progress id="progress" value="0" max="100"></progress>
      <p id="status">Initialisation...</p>
    </div>

    <!-- Chat Interface -->
    <div id="chat">
      <div class="chat-header">
        <h1>Ministral Chat - Mode Texte</h1>
        <div class="chat-header-stats">
          <div id="header-stats">Prêt</div>
        </div>
      </div>

      <div id="messages" class="empty"></div>

      <div id="input-area">
        <div class="input-wrapper">
          <textarea
            id="user-input"
            placeholder="Tapez votre message... (Entrée pour envoyer, Maj+Entrée pour nouvelle ligne)"
            rows="1"
          ></textarea>
          <div class="stats-info">
            <span id="stats">TTFT: — | Tokens/s: —</span>
          </div>
        </div>
        <div class="button-group">
          <button id="send-btn">Envoyer</button>
          <button id="clear-btn">Effacer</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module">
    // Import Transformers.js
    const { AutoProcessor, AutoModelForImageTextToText, TextStreamer } = await import(
      'https://cdn.jsdelivr.net/npm/@huggingface/transformers@3.8.1'
    );

    // Constants
    const MODEL_ID = 'mistralai/Ministral-3-3B-Instruct-2512-ONNX';
    const MAX_NEW_TOKENS = 512;

    // State
    let processor = null;
    let model = null;
    let messages = [];
    let isGenerating = false;
    let lastTTFT = null;
    let lastTPS = null;

    // DOM Elements
    const loadingDiv = document.getElementById('loading');
    const chatDiv = document.getElementById('chat');
    const messagesDiv = document.getElementById('messages');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const clearBtn = document.getElementById('clear-btn');
    const progressBar = document.getElementById('progress');
    const statusText = document.getElementById('status');
    const statsSpan = document.getElementById('stats');
    const headerStats = document.getElementById('header-stats');

    /**
     * Check WebGPU support
     */
    function checkWebGPU() {
      if (!navigator.gpu) {
        const error = 'WebGPU non supporté. Utilisez Chrome 113+, Edge 113+ ou Firefox Nightly.';
        statusText.textContent = error;
        loadingDiv.innerHTML += `<div class="error-message">${error}</div>`;
        sendBtn.disabled = true;
        return false;
      }
      return true;
    }

    /**
     * IndexedDB helper for caching model files
     */
    const cacheDB = {
      dbName: 'MinistralModelCache',
      storeName: 'models',

      async init() {
        return new Promise((resolve, reject) => {
          const request = indexedDB.open(this.dbName, 1);
          request.onerror = () => reject(request.error);
          request.onsuccess = () => resolve(request.result);
          request.onupgradeneeded = (e) => {
            const db = e.target.result;
            if (!db.objectStoreNames.contains(this.storeName)) {
              db.createObjectStore(this.storeName);
            }
          };
        });
      },

      async get(key) {
        const db = await this.init();
        return new Promise((resolve, reject) => {
          const request = db.transaction([this.storeName]).objectStore(this.storeName).get(key);
          request.onerror = () => reject(request.error);
          request.onsuccess = () => resolve(request.result);
        });
      },

      async set(key, value) {
        const db = await this.init();
        return new Promise((resolve, reject) => {
          const request = db.transaction([this.storeName], 'readwrite').objectStore(this.storeName).put(value, key);
          request.onerror = () => reject(request.error);
          request.onsuccess = () => resolve(request.result);
        });
      },

      async clear() {
        const db = await this.init();
        return new Promise((resolve, reject) => {
          const request = db.transaction([this.storeName], 'readwrite').objectStore(this.storeName).clear();
          request.onerror = () => reject(request.error);
          request.onsuccess = () => resolve(request.result);
        });
      }
    };

    /**
     * Load model and processor
     */
    async function loadModel() {
      try {
        if (!checkWebGPU()) return;

        statusText.textContent = 'Chargement du processeur...';
        processor = await AutoProcessor.from_pretrained(MODEL_ID, {
          cache_dir: './models-cache',
        });

        statusText.textContent = 'Chargement du modèle...';

        const progressCallback = (info) => {
          if (info.status === 'progress') {
            const percentage = Math.round((info.loaded / info.total) * 100);
            progressBar.value = percentage;
            statusText.textContent = `Téléchargement: ${percentage}%`;
          }
        };

        // Load with caching options
        model = await AutoModelForImageTextToText.from_pretrained(MODEL_ID, {
          dtype: {
            embed_tokens: 'fp16',
            vision_encoder: 'q4',
            decoder_model_merged: 'q4f16',
          },
          device: 'webgpu',
          progress_callback: progressCallback,
          cache_dir: './models-cache',
          local_files_only: false,
        });

        // Show chat interface
        loadingDiv.style.display = 'none';
        chatDiv.classList.add('active');
        headerStats.textContent = 'Connecté';
        userInput.focus();

        console.log('Modèle chargé avec succès');
      } catch (error) {
        console.error('Erreur lors du chargement du modèle:', error);
        statusText.textContent = `Erreur: ${error.message}`;
        messagesDiv.innerHTML = `<div class="error-message">Erreur: ${error.message}</div>`;
      }
    }

    /**
     * Render a message in the chat
     */
    function renderMessage(role, content, isStreaming = false) {
      messagesDiv.classList.remove('empty');

      const msgDiv = document.createElement('div');
      msgDiv.className = `message ${role}`;

      const contentDiv = document.createElement('div');
      contentDiv.className = `message-content ${isStreaming ? 'streaming' : ''}`;
      contentDiv.textContent = content;

      msgDiv.appendChild(contentDiv);
      messagesDiv.appendChild(msgDiv);

      // Auto-scroll
      setTimeout(() => messagesDiv.scrollTop = messagesDiv.scrollHeight, 0);

      return contentDiv;
    }

    /**
     * Update stats display
     */
    function updateStats(ttft, tps) {
      if (ttft !== null) {
        lastTTFT = (ttft / 1000).toFixed(3);
      }
      if (tps !== null) {
        lastTPS = tps.toFixed(2);
      }

      const ttftStr = lastTTFT !== null ? `${lastTTFT}s` : '—';
      const tpsStr = lastTPS !== null ? lastTPS : '—';

      statsSpan.textContent = `TTFT: ${ttftStr} | Tokens/s: ${tpsStr}`;
    }

    /**
     * Clear conversation
     */
    function clearConversation() {
      messages = [];
      messagesDiv.innerHTML = '';
      messagesDiv.classList.add('empty');
      userInput.value = '';
      lastTTFT = null;
      lastTPS = null;
      updateStats(null, null);
      userInput.focus();
    }

    /**
     * Send message
     */
    function sendMessage() {
      const text = userInput.value.trim();
      if (!text || isGenerating) return;

      // Disable input
      userInput.value = '';
      userInput.disabled = true;
      sendBtn.disabled = true;
      isGenerating = true;

      // Render user message
      renderMessage('user', text);

      // Generate response
      generateResponse(text);
    }

    /**
     * Generate AI response
     */
    async function generateResponse(userMessage) {
      try {
        // Add user message to history
        messages.push({ role: 'user', content: userMessage });

        // Build chat messages with JSON structure requirement
        const chatMessages = [
          {
            role: 'system',
            content: `You are a helpful, concise AI assistant. You MUST respond with ONLY valid JSON in this exact format:
{
  "response": "your answer here",
  "type": "text"
}

Do not add any text before or after the JSON. The JSON must be valid and parseable.`
          },
          ...messages,
        ];

        // Apply chat template
        const prompt = processor.apply_chat_template(chatMessages, {
          tokenize: false,
          add_generation_prompt: true,
        });

        // Tokenize (text only, no image)
        const inputs = await processor.tokenizer(prompt, {
          add_special_tokens: false,
        });

        // Create assistant message for streaming
        const contentDiv = renderMessage('assistant', '', true);
        let fullText = '';
        let tokenCount = 0;
        const startTime = performance.now();
        let firstTokenTime = null;

        // TextStreamer for streaming
        const streamer = new TextStreamer(processor.tokenizer, {
          skip_prompt: true,
          skip_special_tokens: true,
          callback_function: (token) => {
            if (!firstTokenTime) {
              firstTokenTime = performance.now();
              const ttft = firstTokenTime - startTime;
              updateStats(ttft, null);
            }

            fullText += token;
            contentDiv.textContent = fullText;
            tokenCount++;

            // Update TPS
            const elapsed = (performance.now() - firstTokenTime) / 1000;
            if (elapsed > 0) {
              const tps = tokenCount / elapsed;
              updateStats(null, tps);
            }
          },
        });

        // Generate
        await model.generate({
          ...inputs,
          max_new_tokens: MAX_NEW_TOKENS,
          do_sample: false,
          streamer,
          repetition_penalty: 1.2,
        });

        // Finalize message - Parse JSON if present
        contentDiv.classList.remove('streaming');

        // Try to extract and parse JSON
        let parsedResponse = null;
        let displayText = fullText;

        try {
          // Try to find JSON in the response
          const jsonMatch = fullText.match(/\{[\s\S]*\}/);
          if (jsonMatch) {
            parsedResponse = JSON.parse(jsonMatch[0]);
            displayText = parsedResponse.response || fullText;
            // Ensure displayText is a string
            if (typeof displayText !== 'string') {
              displayText = JSON.stringify(displayText);
            }
          }
        } catch (jsonError) {
          console.warn('Could not parse JSON response:', jsonError);
          // Fallback to raw text if JSON parsing fails
          displayText = fullText;
        }

        // Ensure displayText is always a string
        if (typeof displayText !== 'string') {
          displayText = String(displayText);
        }

        // Update display with parsed content
        contentDiv.textContent = displayText;

        // Store the original response (with JSON if available)
        messages.push({
          role: 'assistant',
          content: displayText,
          raw: fullText,
          parsed: parsedResponse
        });

        console.log('Réponse générée:', displayText.substring(0, 50) + '...');
        if (parsedResponse) {
          console.log('JSON structuré:', parsedResponse);
        }
      } catch (error) {
        console.error('Erreur lors de la génération:', error);
        const errorDiv = document.createElement('div');
        errorDiv.className = 'error-message';
        errorDiv.textContent = `Erreur: ${error.message}`;
        messagesDiv.appendChild(errorDiv);
      } finally {
        // Re-enable input
        isGenerating = false;
        userInput.disabled = false;
        sendBtn.disabled = false;
        userInput.focus();
      }
    }

    /**
     * Handle Enter key
     */
    userInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey && !isGenerating) {
        e.preventDefault();
        sendMessage();
      }
    });

    /**
     * Auto-grow textarea
     */
    userInput.addEventListener('input', () => {
      userInput.style.height = 'auto';
      userInput.style.height = Math.min(userInput.scrollHeight, 100) + 'px';
    });

    /**
     * Event listeners
     */
    sendBtn.addEventListener('click', sendMessage);
    clearBtn.addEventListener('click', clearConversation);

    /**
     * Clean up GPU resources on page unload
     */
    window.addEventListener('beforeunload', () => {
      if (model && typeof model.dispose === 'function') {
        try {
          model.dispose();
        } catch (e) {
          console.warn('Error disposing model:', e);
        }
      }
    });

    /**
     * Initialize
     */
    document.addEventListener('DOMContentLoaded', loadModel);

    // Also load immediately if DOM is already ready
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', loadModel);
    } else {
      loadModel();
    }
  </script>
</body>
</html>
